<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-labelledby="title desc"><title id="title">NIR warmth followed by Cryo-Infusion cooling</title><desc id="desc">Simplified illustration. Near-infrared warmth acts below the skin surface in the dermis. Cryo-Infusion follows with cooling at the surface. Layers and depth are illustrative and not to scale.</desc><defs><linearGradient id="warm" x2="0" y2="1"><stop stop-color="#72181b" stop-opacity=".02"/><stop offset=".5" stop-color="#bf7762" stop-opacity=".32"/><stop offset="1" stop-color="#bf7762" stop-opacity=".05"/></linearGradient><linearGradient id="cold" x2="0" y2="1"><stop stop-color="#afc3c2" stop-opacity=".6"/><stop offset="1" stop-color="#afc3c2" stop-opacity=".03"/></linearGradient></defs><rect width="520" height="600" fill="#f1ede7"/><g font-family="Arial,sans-serif" fill="#413f42"><text x="35" y="42" font-size="11" letter-spacing="2" fill="#86704c">THE CONTRAST APPROACH</text><text x="35" y="80" font-size="27" font-family="Georgia,serif">Warmth, then cooling.</text><text x="35" y="122" font-size="12" fill="#86704c">01 / NEAR-INFRARED WARMTH</text><g transform="translate(35 143)"><rect width="450" height="125" rx="4" fill="#e6d4c4"/><path d="M0 42 Q45 27 90 42 T180 42 T270 42 T360 42 T450 42 L450 0H0Z" fill="#cfb39b"/><path d="M0 0H450" stroke="#86704c" stroke-width="2"/><rect x="35" y="0" width="280" height="125" fill="url(#warm)"/><g stroke="#72181b" stroke-width="1.7" fill="none" opacity=".6"><path d="M70 -15 Q60 0 70 15 T70 45 T70 75"/><path d="M135 -15 Q125 0 135 15 T135 45 T135 75"/><path d="M200 -15 Q190 0 200 15 T200 45 T200 75"/><path d="M265 -15 Q255 0 265 15 T265 45 T265 75"/></g><g stroke="#a88b70" stroke-width="2" fill="none"><path d="M20 89 Q70 57 120 89 T220 89 T320 89"/><path d="M20 109 Q70 77 120 109 T220 109 T320 109"/></g><text x="330" y="24" font-size="11">Skin surface</text><text x="330" y="75" font-size="11">Dermis</text><text x="330" y="94" font-size="10" fill="#6f6259">Collagen layer</text></g><text x="35" y="296" font-size="14">Warmth works below the surface.</text><text x="35" y="318" font-size="12" fill="#6f6259">Supports a firmer, more lifted look over time.</text><path d="M260 337V364m-5-5 5 5 5-5" stroke="#86704c" fill="none"/><text x="35" y="390" font-size="12" fill="#86704c">02 / CRYO-INFUSION COOLING</text><g transform="translate(35 413)"><rect width="450" height="105" rx="4" fill="#e6d4c4"/><path d="M0 42 Q45 27 90 42 T180 42 T270 42 T360 42 T450 42 L450 0H0Z" fill="#cfb39b"/><rect width="450" height="80" fill="url(#cold)"/><path d="M0 0H450" stroke="#819e9c" stroke-width="3"/><g stroke="#789694" stroke-width="1.5" fill="none"><path d="M48 -24v16m-8-8h16m-13-5 10 10m0-10-10 10M118 -24v16m-8-8h16m-13-5 10 10m0-10-10 10M188 -24v16m-8-8h16m-13-5 10 10m0-10-10 10M258 -24v16m-8-8h16m-13-5 10 10m0-10-10 10"/></g><text x="330" y="25" font-size="11">Skin surface</text></g><text x="35" y="548" font-size="14">Cooling refreshes the skin.</text><text x="35" y="570" font-size="12" fill="#6f6259">Less visible puffiness. A dewy, hydrated finish.</text></g></svg>